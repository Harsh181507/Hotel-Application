# Render Blueprint: creates the whole app on Render in one go.
# Render dashboard -> New -> Blueprint -> pick this GitHub repo.
#
# One web service runs the API, the live chat AND serves the website,
# so the hotel has a single address: https://hotel-demo.onrender.com
services:
  - type: web
    name: hotel-demo
    runtime: node
    plan: free            # free sleeps after 15 min idle; use "starter" for a real hotel
    region: singapore     # closest Render region to India
    buildCommand: npm run render-build
    startCommand: npm start   # creates/updates tables, then starts the server
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "22"
      - key: DATABASE_URL
        fromDatabase:
          name: anemos-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true   # Render creates a long random secret
      - key: SEED_ADMIN_EMAIL
        sync: false           # Render asks you for this when you create the Blueprint
      - key: SEED_ADMIN_PASSWORD
        sync: false           # choose a strong password (8+ characters)

databases:
  - name: anemos-db
    plan: free            # free databases are deleted after 30 days; use "basic-256mb" for real use
    region: singapore
    databaseName: anemos
    user: anemos
    postgresMajorVersion: "16"
